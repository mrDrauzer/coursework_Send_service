{% extends 'base.html' %}
{% block title %}Сообщение — {{ object.subject }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">{{ object.subject }}</h1>
  <div>
    <a class="btn btn-outline-primary" href="{% url 'mailings:message_update' object.pk %}">Изменить</a>
    <a class="btn btn-outline-danger ms-2" href="{% url 'mailings:message_delete' object.pk %}">Удалить</a>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <pre class="mb-0" style="white-space: pre-wrap;">{{ object.body }}</pre>
  </div>
</div>

<div class="mt-3">
  <a class="btn btn-secondary" href="{% url 'mailings:message_list' %}">К списку</a>
  </div>
{% endblock %}

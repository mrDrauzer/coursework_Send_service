{% extends 'base.html' %}
{% block title %}Удалить сообщение{% endblock %}
{% block content %}
<h1 class="h5 mb-3">Удалить сообщение «{{ object.subject }}»?</h1>
<div class="alert alert-warning">Это действие нельзя будет отменить.</div>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger" type="submit">Да, удалить</button>
  <a class="btn btn-outline-secondary ms-2" href="{% url 'mailings:message_detail' object.pk %}">Отмена</a>
</form>
{% endblock %}

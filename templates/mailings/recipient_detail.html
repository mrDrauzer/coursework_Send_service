{% extends 'base.html' %}
{% block title %}Получатель — {{ object.full_name }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">{{ object.full_name }}</h1>
  <div>
    <a class="btn btn-outline-primary" href="{% url 'mailings:recipient_update' object.pk %}">Изменить</a>
    <a class="btn btn-outline-danger ms-2" href="{% url 'mailings:recipient_delete' object.pk %}">Удалить</a>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <div class="mb-2"><strong>Email:</strong> {{ object.email }}</div>
    <div class="mb-2"><strong>Комментарий:</strong><br>{{ object.comment|linebreaksbr|default:'—' }}</div>
  </div>
</div>

<div class="mt-3">
  <a class="btn btn-secondary" href="{% url 'mailings:recipient_list' %}">К списку</a>
  </div>
{% endblock %}
